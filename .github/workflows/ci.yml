name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # PKI / JWT certificate provisioning
      #
      # certs/ is intentionally excluded from Git because it contains
      # private keys and generated certificates.
      #
      # GitHub Actions therefore starts without the JWT signing keys,
      # CA, or service certificates required by PyZTNA.
      #
      # All services run on the same GitHub Actions runner during the
      # integration tests, so localhost is used for every host.
      # ------------------------------------------------------------
      - name: Provision ephemeral CI certificates
        run: >
          python -m tools.provision_certs
          --idp-host 127.0.0.1
          --gateway-host 127.0.0.1
          --docs-host 127.0.0.1
          --finance-host 127.0.0.1
          --out dist

      # ------------------------------------------------------------
      # Verify installation
      # ------------------------------------------------------------
      - name: Verify install
        run: python VERIFY_INSTALL.py

      # ------------------------------------------------------------
      # Integration tests
      #
      # The test suite starts the real IdP, Gateway and protected
      # resources and communicates with them over real sockets.
      # ------------------------------------------------------------
      - name: Run test suite
        timeout-minutes: 10
        run: python -m unittest tests.test_ztna -v

  # ================================================================
  # SECRET / PRIVATE KEY GUARD
  # ================================================================
  secrets-guard:
    name: No committed key material
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history allows the security check to inspect the
          # complete tracked repository tree.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked files for private keys
        run: python -m tools.check_no_secrets

  # ================================================================
  # DEPENDENCY SECURITY AUDIT
  # ================================================================
  audit:
    name: Dependency CVE scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit pinned dependencies
        # Dependency findings are currently informational.
        # Remove continue-on-error after reported advisories have
        # been reviewed and resolved.
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --strict --desc

  # ================================================================
  # SYNTAX / BYTE-COMPILE CHECK
  # ================================================================
  lint:
    name: Syntax and byte-compile check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all sources
        run: >
          python -m compileall -q
          agent
          common
          dashboard
          gateway
          idp
          pdp
          resources
          tools
          tests