# PyZTNA -- example reverse proxy in front of the Gateway (and optionally
# the IdP) for a real multi-host deployment. Addresses the "stdlib HTTP
# server has no WAF-level protection" gap named in docs/ARCHITECTURE.md
# Section 4 and docs/HARDENING.md, WITHOUT rewriting the application layer:
# nginx handles request-size limits, connection-level rate limiting, and
# (optionally) public TLS termination with a real CA cert (Let's Encrypt /
# internal enterprise CA), while the Gateway's own TLS is used for the
# nginx -> Gateway hop (upstream), keeping "encrypt everything" intact end
# to end.
#
# This does NOT replace the Gateway's own JWT/PDP/mTLS enforcement -- it
# sits in front of it as defense-in-depth. Adjust upstream addresses for
# your actual deployment topology (see docs/WINDOWS_SETUP.md Section 9 and
# deploy/README.md).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Edge-level abuse protection the stdlib HTTP servers don't have ---
    client_max_body_size 64k;                 # PyZTNA's JSON bodies are tiny
    client_body_timeout 10s;
    client_header_timeout 10s;

    limit_req_zone $binary_remote_addr zone=ztna_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ztna_general:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=ztna_conn:10m;

    upstream ztna_gateway {
        # Add more `server` lines here for a multi-instance Gateway (HA) --
        # see docs/HARDENING.md "known remaining gaps" for what else that
        # requires (the revocation store currently assumes a single
        # shared filesystem across instances).
        server 127.0.0.1:9200;
    }

    upstream ztna_idp {
        server 127.0.0.1:9000;
    }

    server {
        listen 443 ssl;
        server_name ztna.example.internal;

        # Public-facing cert -- use a real internal CA or Let's Encrypt
        # here, NOT the PyZTNA internal CA (that CA is for
        # service-to-service trust, not for end-user browsers/clients).
        ssl_certificate     /etc/nginx/certs/ztna_public.crt;
        ssl_certificate_key /etc/nginx/certs/ztna_public.key;

        limit_conn ztna_conn 20;

        location /access/ {
            limit_req zone=ztna_general burst=20 nodelay;
            proxy_pass https://ztna_gateway;
            proxy_ssl_verify off;  # nginx -> Gateway is on a trusted internal link;
                                    # point this at the PyZTNA CA cert for full verification
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /health {
            proxy_pass https://ztna_gateway;
            proxy_ssl_verify off;
        }
    }

    server {
        listen 443 ssl;
        server_name ztna-idp.example.internal;

        ssl_certificate     /etc/nginx/certs/ztna_public.crt;
        ssl_certificate_key /etc/nginx/certs/ztna_public.key;

        location /login {
            # Edge-level rate limiting IN ADDITION TO the IdP's own
            # per-username lockout (common/rate_limiter.py) -- this layer
            # limits by source IP regardless of which username is being
            # tried, catching a distributed credential-stuffing attempt
            # the per-username limiter alone wouldn't slow down.
            limit_req zone=ztna_login burst=5 nodelay;
            proxy_pass https://ztna_idp;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            limit_req zone=ztna_general burst=20 nodelay;
            proxy_pass https://ztna_idp;
            proxy_ssl_verify off;
        }
    }
}
